name: Release health

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  schedule:
    - cron: '15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  release-labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check for tagged releases still labeled pending
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-health.mjs
